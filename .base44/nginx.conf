# Minimal nginx main config for the Base44 sandbox (mounted over
# /etc/nginx/nginx.conf). It serves the repo as static files on port 80,
# which compose maps to host port 3000.
#
# Why the workers stay root: the repo is bind-mounted from the sandbox home
# directory, which is mode 0700 and owned by root, so the stock config's
# unprivileged `user nginx;` worker cannot traverse it and every request
# would answer 403. This container only reads a few static files, and the
# sandbox is an isolated dev microVM, so dropping privileges is not needed.
user  root;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # No caching, so a source edit shows up on the next preview reload.
        add_header Cache-Control "no-store";

        # Never expose dotfiles/dot-directories (.git, .base44) from the mount.
        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
